name: Build kbm_pad.prx

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout create-fself
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          path: create-fself

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.17'
          cache: false

      - name: Build create-fself
        working-directory: create-fself/cmd/create-fself
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tools"
          go build -o "$GITHUB_WORKSPACE/tools/create-fself" -modfile=go-linux.mod
          chmod +x "$GITHUB_WORKSPACE/tools/create-fself"

      - name: Pull OpenOrbis toolchain image
        run: docker pull openorbisofficial/toolchain:latest

      - name: Show toolchain info (diagnostico)
        run: |
          info=$(docker run --rm --user root openorbisofficial/toolchain:latest bash -c '
            echo "headers:"; ls "$OO_PS4_TOOLCHAIN/include/orbis" | grep -E "^(Pad|Keyboard|Mouse|UserService|Sysmodule|libkernel)\.h$" | tr "\n" " "; echo
            echo "types:"; ls "$OO_PS4_TOOLCHAIN/include/orbis/_types" | grep -i -E "keyboard|pad|sysmodule" | tr "\n" " "; echo
            echo "clang:"; clang --version | head -1' 2>&1 || true)
          echo "::notice title=Toolchain info::$(printf '%s' "$info" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"

      - name: Build kbm_pad.prx
        run: |
          set +e
          docker run --rm --user root -w /workspace \
            -v "$PWD":/workspace -v "$PWD/tools":/tools:ro \
            openorbisofficial/toolchain:latest \
            make FSELF=/tools/create-fself 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            errs=$(grep -n -i -E "error|undefined|cannot find|not found|No rule|\*\*\*" build.log | head -40)
            last=$(tail -25 build.log)
            report=$(printf '%s\n--- tail ---\n%s' "$errs" "$last")
            echo "::error title=Build failed (exit $rc)::$(printf '%s' "$report" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit $rc

      - name: Inspect ELFs (diagnostico)
        if: always()
        run: |
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
          for e in kbm_pad kbm_probe_a; do
            out=$(bash tools/inspect_elf.sh "build/$e.elf" 2>&1 | head -c 12000)
            echo "::notice title=ELF $e::$(printf '%s' "$out" | enc)"
          done
          und() { readelf --dyn-syms -W "$1" 2>/dev/null | awk '$7=="UND"{print $8}' | sort -u; }
          und build/kbm_pad.elf > /tmp/pad.und
          und build/kbm_probe_a.elf > /tmp/a.und
          only_pad=$(comm -23 /tmp/pad.und /tmp/a.und | tr '\n' ' ')
          only_a=$(comm -13 /tmp/pad.und /tmp/a.und | tr '\n' ' ')
          echo "::notice title=Imports distintos::solo en kbm_pad: $only_pad || solo en probe_a: $only_a"

      - name: Check output
        run: |
          ls -l kbm_pad.prx
          file kbm_pad.prx || true
          echo "Simbolos exportados que necesita el plugin_loader de GoldHEN:"
          for s in plugin_load plugin_unload g_pluginName module_start module_stop; do
            in_elf=NO; in_prx=NO
            strings -a build/kbm_pad.elf | grep -qx "$s" && in_elf=si
            strings -a kbm_pad.prx | grep -qx "$s" && in_prx=si
            echo "$s  elf=$in_elf  prx=$in_prx"
            [ "$in_elf" = si ] || missing=1
            [ "$in_prx" = si ] || echo "::warning title=Simbolo no visible en el .prx::$s"
          done
          [ -z "$missing" ] || { echo "::error title=Falta simbolo exportado::revisa visibilidad/linker"; exit 1; }

      - name: Publish release (latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest kbm_pad.prx kbm_s1n.prx kbm_probe_d.prx kbm_s1k.prx kbm_probe_c.prx kbm_s1.prx kbm_s2.prx kbm_probe.prx kbm_probe_a.prx kbm_probe_b.prx \
            --title "Ultima compilacion" --target "$GITHUB_SHA" \
            --notes "Archivos .prx directos (sin zip). Commit: $GITHUB_SHA"

      - name: Upload kbm_pad.prx
        uses: actions/upload-artifact@v4
        with:
          name: kbm_pad-prx
          path: |
            kbm_pad.prx
            kbm_probe.prx
            kbm_probe_a.prx
            kbm_probe_b.prx
            kbm_s1.prx
            kbm_s2.prx
            kbm_s1k.prx
            kbm_probe_c.prx
            kbm_s1n.prx
            kbm_probe_d.prx
          if-no-files-found: error
