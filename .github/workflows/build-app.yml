name: Build kbm_manager PKG

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      OO_PS4_TOOLCHAIN: ${{ github.workspace }}/oo-toolchain
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      APP_VER: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar compilador y dependencias
        run: sudo apt-get update && sudo apt-get install -y clang lld libicu-dev libssl-dev

      - name: Descargar OpenOrbis PS4 Toolchain (ultimo release)
        run: |
          mkdir -p dl "$OO_PS4_TOOLCHAIN"
          gh release download --repo OpenOrbis/OpenOrbis-PS4-Toolchain --pattern '*.tar.gz' --dir dl
          tar -xzf dl/*.tar.gz -C "$OO_PS4_TOOLCHAIN"
          if [ ! -f "$OO_PS4_TOOLCHAIN/link.x" ]; then
            inner=$(dirname "$(find "$OO_PS4_TOOLCHAIN" -name link.x | head -1)")
            cp -a "$inner"/. "$OO_PS4_TOOLCHAIN"/
          fi
          chmod +x "$OO_PS4_TOOLCHAIN"/bin/linux/* || true

      - name: Compilar PKG
        run: make -C app VERSION="$APP_VER" 2>&1 | tee app/build.log; exit ${PIPESTATUS[0]}

      - name: Mostrar errores de compilacion
        if: failure()
        run: |
          grep -nE 'error|undefined|ERROR|No such|not found|cannot|Error' app/build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          echo "::error::ULTIMAS: $(tail -n 8 app/build.log | tr '\n' '|' | cut -c1-600)"

      - name: Subir PKG como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: kbm_manager-PKG
          path: app/*.pkg

      - name: Publicar PKG en la rama app-dist (de ahi se actualiza la app)
        run: |
          d=$(mktemp -d)
          cp app/*.pkg "$d/kbm_manager.pkg"
          echo "$APP_VER" > "$d/APP_VERSION"
          cd "$d"
          git init -q -b app-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "kbm_manager v$APP_VER (PKG para la auto-actualizacion de la app)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" app-dist

      - name: Publicar PKG en Releases (tag manager)
        run: |
          cp app/*.pkg kbm_manager.pkg
          cp app/*.pkg "kbm_manager_v$APP_VER.pkg"
          gh release delete manager --cleanup-tag -y || true
          gh release create manager kbm_manager.pkg "kbm_manager_v$APP_VER.pkg" --target "$GITHUB_SHA" \
            --title "kbm_manager (app PKG)" \
            --notes "App para PS4: descarga el plugin kbm_pad y lo activa/desactiva. Version $APP_VER (usa kbm_manager_v$APP_VER.pkg: el nombre cambia con cada version para no confundir descargas viejas). Commit: $GITHUB_SHA"
